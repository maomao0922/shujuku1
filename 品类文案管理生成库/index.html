<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>品类文案管理生成库 · 信息流编导文案中枢</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <!-- 由 JS 动态渲染 -->
    </aside>

    <!-- 主内容区 -->
    <main class="main">
      <!-- 顶栏 -->
      <header class="topbar">
        <div class="topbar-title">产品归档</div>
        <div class="topbar-actions">
          <span id="cloud-status" style="font-size:13px;color:var(--gray-400);cursor:pointer" onclick="settingsModal()">☁️ 本地</span>
          <button class="btn btn-sm" onclick="settingsModal()" title="设置">⚙️ 设置</button>
        </div>
      </header>

      <!-- 内容区 -->
      <div class="content">
        <!-- 由 JS 动态渲染 -->
      </div>
    </main>
  </div>

  <!-- 脚本 -->
  <script src="js/frameworks.js"></script>
  <script src="js/store.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
